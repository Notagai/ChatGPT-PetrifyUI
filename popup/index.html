<!doctype html>
<html lang="en">

    <title>PetrifyUI</title>
    <link rel="stylesheet" href="popup.css" />

    <main>
      <div class="brand"><span class="mark" aria-hidden="true">▥</span><div><h1>PetrifyUI</h1><p>SIDEBAR EDITION · 1.3</p></div></div>

      <p class="footer">Local-only • chatgpt.com</p>
    </main>
